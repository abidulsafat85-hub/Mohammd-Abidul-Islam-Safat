[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "node-cron"]

# Route API requests to the serverless Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Single Page App (SPA) fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
